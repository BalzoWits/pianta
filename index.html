<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pianta</title>
<meta name="description" content="Progetta casa nel browser: pianta 2D con quote, ricalco da foto con lettura automatica delle quote, vista 3D, arredi e render fotorealistico.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f5f2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f343b'/%3E%3Cpath d='M7 7h18v18H7zM16 7v9h9M7 18h6' fill='none' stroke='%23f6f5f2' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=6">
<script type="importmap">
{ "imports": {
  "three": "./lib/three.module.js",
  "three/addons/": "./lib/addons/",
  "three/examples/jsm/": "./lib/addons/",
  "three-mesh-bvh": "./lib/three-mesh-bvh.js",
  "three-gpu-pathtracer": "./lib/three-gpu-pathtracer.js",
  "three/webgpu": "./lib/three.webgpu.js",
  "three/tsl": "./lib/three.tsl.js",
  "pathtracer-webgpu": "./lib/pathtracer-webgpu.js"
} }
</script>
<script src="/torna.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#2f343b"/><path d="M7 7h18v18H7zM16 7v9h9M7 18h6" fill="none" stroke="#f6f5f2" stroke-width="2.4"/></svg>
    <span>Pianta</span>
  </div>
  <button type="button" class="btn ghost" id="btnProjects" title="Tutti i progetti">
    <svg viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></svg><span class="lbl">Progetti</span>
  </button>
  <button type="button" class="projname" id="projName" title="Rinomina il progetto">…</button>
  <span class="grow"></span>
  <div class="seg" id="viewSeg" role="tablist">
    <button type="button" data-view="2d" class="on">2D</button>
    <button type="button" data-view="3d">3D</button>
    <button type="button" data-view="render">Render</button>
  </div>
  <span class="grow"></span>
  <button type="button" class="btn ghost icon" id="btnUndo" title="Annulla (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button type="button" class="btn ghost icon" id="btnRedo" title="Ripeti (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button type="button" class="cloudbtn out" id="btnCloud" title="Salvataggio online"></button>
</header>

<div class="main">
  <nav class="tools" id="tools" aria-label="Strumenti"></nav>
  <div class="stage" id="stage">
    <canvas id="plan"></canvas>
    <div id="v3d" hidden></div>
    <div class="typed" id="typed" hidden></div>
    <div class="hint" id="hint"></div>
    <div class="walkpad" id="walkpad" hidden>
      <button type="button" data-k="KeyW" class="up" aria-label="Avanti">▲</button>
      <button type="button" data-k="ArrowLeft" class="lt" aria-label="Gira a sinistra">◀</button>
      <button type="button" data-k="ArrowRight" class="rt" aria-label="Gira a destra">▶</button>
      <button type="button" data-k="KeyS" class="dn" aria-label="Indietro">▼</button>
    </div>
    <div class="renderbar" id="renderbar" hidden>
      <span id="rSamples">0 passaggi</span>
      <button type="button" class="btn" id="rSave">Salva immagine</button>
    </div>
  </div>
  <aside class="panel" id="panel"></aside>
</div>

<div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast"></div>
<div id="busy" class="busy" hidden><div class="busy-box"><div class="spin"></div><div id="busyMsg">Attendi…</div></div></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileModel" accept=".obj,.stl,.glb,.gltf" hidden>
<input type="file" id="fileProject" accept=".json,application/json" hidden>
<script type="module" src="js/app.js?v=12"></script>
</body>
</html>
